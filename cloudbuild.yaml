# Cloud Build — frontend Next.js (usługa Cloud Run `frontend`).
#
# TEN PLIK buduje wyłącznie ./frontend i wdraża obraz na usługę `frontend`.
# Backend Spring Boot ma osobny plik: backend/cloudbuild.yaml (usługa `ebe-power`).
# Trigger o nazwie "backend" NIE MOŻE wskazywać tutaj — wcześniej nadpisywał
# usługę `ebe-power` obrazem sklepu Next.js (HTML zamiast JSON API).
#
# Substitutions są definiowane w ustawieniach triggera Cloud Build
# (można je nadpisać per trigger, bez edytowania tego pliku).
#
#   _APP_URL       — produkcyjna domena. MUSI wskazywać na https://sklep.ebe-power.pl,
#                    nigdy na wewnętrzny adres *.run.app — z niego NextAuth
#                    buduje redirect_uri wysyłane do Google podczas OAuth.
#   _REGION        — region Cloud Run.
#
# Nazwa usługi Cloud Run jest zahardkodowana jako `frontend` (nie substytucja),
# żeby trigger z _SERVICE_NAME=ebe-power nie mógł wrzucić tego obrazu na backend.
#
# API_URL (wewnętrzny adres backendu Spring Boot) jest ustawione BEZPOŚREDNIO
# w usłudze Cloud Run (sekcja „Zmienne i sekrety"), np.
# https://ebe-power-....europe-west1.run.app. Nie ustawiamy go tutaj, żeby
# `gcloud run deploy` go nie nadpisywał. Proxy /api/backend czyta je w runtime.
substitutions:
  _APP_URL: 'https://sklep.ebe-power.pl'
  _REGION: 'europe-west1'

# WAŻNE — dlaczego "SHA" każdego buildu jest inne:
# Docker buduje obrazy content-addressed, więc digest (SHA256) zmienia się przy
# KAŻDYM buildzie — to normalne i tak ma być. Problem pojawia się dopiero wtedy,
# gdy serwis Cloud Run wskazuje na digest (sha256:...) zamiast na stały tag.
# Poniżej obraz dostaje DWA tagi:
#   * :v1         — stały, "ruchomy" tag. To na niego ma wskazywać Cloud Run
#                   (deploy zawsze bierze najnowszy obraz z tego tagu).
#   * :$SHORT_SHA — unikalny tag per build (7 znaków commita), do podglądu,
#                   wycofań (rollback) i identyfikacji konkretnej wersji.
# Dzięki temu serwis nigdy nie ma "złego SHA" — śledzi :v1, a :$SHORT_SHA
# zostaje jako etykieta danej wersji.
steps:
  # 1. Budowanie obrazu Docker z argumentami (ARG) i dwoma tagami
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--build-arg'
      - 'NEXT_PUBLIC_SUPABASE_URL=$_SUPABASE_URL'
      - '--build-arg'
      - 'NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$_SUPABASE_KEY'
      - '--build-arg'
      - 'NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=$_STRIPE_KEY'
      - '--build-arg'
      - 'NEXT_PUBLIC_APP_URL=$_APP_URL'
      - '--build-arg'
      - 'NEXT_PUBLIC_SITE_URL=$_APP_URL'
      - '--build-arg'
      - 'NEXTAUTH_URL=$_APP_URL'
      - '-t'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/sklep-repo/sklep-frontend:v1'
      - '-t'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/sklep-repo/sklep-frontend:$SHORT_SHA'
      - './frontend'

  # 2. Wdrożenie nowej rewizji do Cloud Run.
  #    Deploy bierze obraz ze stałego tagu :v1 (czyli zawsze najnowszy build).
  #
  #    UWAGA — wymagane uprawnienia dla konta usługowego Cloud Build
  #    (PROJECT_NUMBER@cloudbuild.gserviceaccount.com):
  #      * roles/run.admin               (Cloud Run Admin)
  #      * roles/iam.serviceAccountUser  (na koncie serwisowym, którym działa
  #                                        usługa Cloud Run)
  #
  #    Nie ustawiamy tutaj zmiennych środowiskowych celowo: `--set-env-vars`
  #    WYMAZUJE pozostałe zmienne (NEXTAUTH_SECRET, GOOGLE_CLIENT_ID,
  #    GOOGLE_CLIENT_SECRET), które są skonfigurowane bezpośrednio w usłudze.
  #    Jeśli chcesz coś dopisać, użyj `--update-env-vars` (dopisuje, nie czyści).
  #
  #    Jeśli trigger jest jednocześnie skonfigurowany jako "continuous
  #    deployment" w Cloud Run, ten krok wywoła drugie, nieszkodliwe wdrożenie
  #    tej samej rewizji — ostatnia wygrywa. Wtedy można usunąć ten krok.
  #
  #    Usługa jest literałem `frontend` (nie $_SERVICE_NAME) — pomyłkowa
  #    substytucja triggera nie może nadpisać backendu (`ebe-power`).
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'frontend'
      - '--image'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/sklep-repo/sklep-frontend:v1'
      - '--region'
      - '$_REGION'
      - '--platform'
      - 'managed'
      - '--project'
      - '$PROJECT_ID'

options:
  logging: CLOUD_LOGGING_ONLY

# Obrazy zapisane w Artifact Registry po buildzie.
# :v1 jest pierwszy — to z niego krok deploy bierze nową rewizję.
images:
  - 'europe-west1-docker.pkg.dev/$PROJECT_ID/sklep-repo/sklep-frontend:v1'
  - 'europe-west1-docker.pkg.dev/$PROJECT_ID/sklep-repo/sklep-frontend:$SHORT_SHA'
