substitutions:
  _APP_URL: 'https://ebe-power.pl'

steps:
  # Budowanie obrazu Docker z argumentami (ARG)
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--build-arg'
      - 'NEXT_PUBLIC_SUPABASE_URL=$_SUPABASE_URL'
      - '--build-arg'
      - 'NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$_SUPABASE_KEY'
      - '--build-arg'
      - 'NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=$_STRIPE_KEY'
      - '--build-arg'
      - 'NEXT_PUBLIC_API_URL=$_API_URL'
      - '--build-arg'
      - 'NEXT_PUBLIC_APP_URL=$_APP_URL'
      - '--build-arg'
      - 'NEXT_PUBLIC_SITE_URL=$_APP_URL'
      - '--build-arg'
      - 'NEXTAUTH_URL=$_APP_URL'
      - '-t'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/sklep-repo/sklep-frontend:v1'
      - './frontend'

options:
  logging: CLOUD_LOGGING_ONLY

# Zapisanie gotowego obrazu w Artifact Registry (Google)
images:
  - 'europe-west1-docker.pkg.dev/$PROJECT_ID/sklep-repo/sklep-frontend:v1'
