spring.application.name=ebe-power
# Cloud Run wstrzykuje PORT (domyślnie 8080). Bez tego Spring słucha tylko
# na 8080 z application defaults — zrywa się, gdy platforma zmieni port.
server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres-db:5432/sklep_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:shop_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:shop_password}

stripe.stripe_secret_key=${STRIPE_SECRET_KEY:}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:}

spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# --- Poczta (SMTP) ---
# WAŻNE (najczęstsza przyczyna "cichej" niedostarczalności):
#  1. MAIL_USERNAME i MAIL_PASSWORD muszą być ustawione w środowisku (Cloud Run /
#     docker-compose) — puste defaulty poniżej oznaczają, że wysyłka padnie na auth.
#  2. Login SMTP powinien być TĄ SAMA skrzynką co adres nadawcy (MAIL_FROM,
#     domyślnie kontakt@ebe-power.pl) — seohost odrzuca wysyłkę "w cudzym imieniu".
spring.mail.host=${MAIL_HOST:h76.seohost.pl}
spring.mail.port=${MAIL_PORT:465}

spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.trust=${MAIL_HOST:h76.seohost.pl}
# Limity czasu (ms) — bez nich JavaMail może wisieć w nieskończoność i nic nie zalogować
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=15000
spring.mail.properties.mail.smtp.writetimeout=15000

# Adres nadawcy wiadomości sklepu oraz token endpointu testowego
# (POST /api/payment/mail-test?token=... — wyłączony, gdy token pusty)
shop.mail.from=${MAIL_FROM:kontakt@ebe-power.pl}
shop.mail.test-token=${MAIL_TEST_TOKEN:}

